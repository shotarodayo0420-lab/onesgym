name: SEO quality check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 1 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate SEO essentials and internal links
        run: node scripts/seo-check.mjs
